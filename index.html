<html lang="en">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CineSync — Synchronized watch parties</title>
  <meta name="description" content="Create a room, invite friends and watch videos together in perfect sync with chat, polls and reactions." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

  <style>
    * {
      border-radius: 0px;
      box-sizing: border-box;
    }
    body {
      font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
      background-color: #f4f4f5;
      color: #09090b;
      margin: 0;
    }
    h1, h2, h3 {
      font-family: "Archivo", sans-serif;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.95;
    }
    .field {
      width: 100%;
      border: 1px solid #09090b;
      background: #ffffff;
      padding: 0.6rem 0.75rem;
      font-size: 0.875rem;
      outline: none;
    }
    .field:focus {
      box-shadow: inset 0 0 0 1px #09090b;
    }
    .pill {
      border: 1px solid #09090b;
      background: #ffffff;
      padding: 0.25rem 0.65rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .pill:hover {
      background: #f4f4f5;
    }
    .pill[data-active="true"] {
      background: #09090b;
      color: #ffffff;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
    }
    .cta:hover {
      text-decoration: underline;
    }
    .cta:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      text-decoration: none;
    }
    .cta .arrow {
      display: inline-block;
      transition: transform 0.15s ease;
    }
    .cta:hover:not(:disabled) .arrow {
      transform: translateX(3px);
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 28s linear infinite;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 1;
      }
      100% {
        transform: translateY(-220px) scale(1.25);
        opacity: 0;
      }
    }
    .float-up {
      animation: floatUp 2.6s ease-out forwards;
    }
  </style>
</head>
<body>

  <script type="text/babel">
    const { useState, useEffect, useRef, useSyncExternalStore } = React;

    // --- ICONS ---
    const Crown = ({ size = 14 }) => (

    const ChevronDown = ({ size = 15 }) => (

    const XIcon = ({ size = 15 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    );

    // --- MOVIES LIBRARY (src/lib/movies.ts) ---
    const B = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/";
    const MOVIES = [
      { id: "bbb", title: "Big Buck Bunny", year: 2008, genres: ["Animation", "Comedy"], duration: "9:56", curated: "Staff Pick", src: B + "BigBuckBunny.mp4", blurb: "A giant rabbit takes revenge on three bullying rodents." },
      { id: "ed", title: "Elephants Dream", year: 2006, genres: ["Animation", "Sci-Fi"], duration: "10:53", src: B + "ElephantsDream.mp4", blurb: "Two men explore a surreal, endless machine." },
      { id: "sintel", title: "Sintel", year: 2010, genres: ["Animation", "Fantasy", "Drama"], duration: "14:48", curated: "Staff Pick", src: B + "Sintel.mp4", blurb: "A lonely girl searches for her baby dragon." },
      { id: "tos", title: "Tears of Steel", year: 2012, genres: ["Sci-Fi", "Action"], duration: "12:14", curated: "Trending", src: B + "TearsOfSteel.mp4", blurb: "Warriors and scientists try to save the world from robots." },
      { id: "blazes", title: "For Bigger Blazes", year: 2013, genres: ["Short", "Action"], duration: "0:15", src: B + "ForBiggerBlazes.mp4", blurb: "Fifteen seconds of pure fire." },
      { id: "escapes", title: "For Bigger Escapes", year: 2013, genres: ["Short", "Adventure"], duration: "0:15", src: B + "ForBiggerEscapes.mp4", blurb: "A quick getaway to somewhere bigger." },
      { id: "fun", title: "For Bigger Fun", year: 2013, genres: ["Short", "Comedy"], duration: "1:00", curated: "Trending", src: B + "ForBiggerFun.mp4", blurb: "A minute of loud, colorful fun." },
      { id: "joyrides", title: "For Bigger Joyrides", year: 2013, genres: ["Short", "Adventure"], duration: "0:15", src: B + "ForBiggerJoyrides.mp4", blurb: "Hit the road for a short burst." },
      { id: "meltdowns", title: "For Bigger Meltdowns", year: 2013, genres: ["Short", "Comedy"], duration: "0:15", src: B + "ForBiggerMeltdowns.mp4", blurb: "When things go spectacularly wrong." },
      { id: "subaru", title: "Outback on Street and Dirt", year: 2014, genres: ["Documentary", "Cars"], duration: "9:54", src: B + "SubaruOutbackOnStreetAndDirt.mp4", blurb: "One wagon, two very different surfaces." },
      { id: "gti", title: "Volkswagen GTI Review", year: 2014, genres: ["Documentary", "Cars"], duration: "9:56", src: B + "VolkswagenGTIReview.mp4", blurb: "An honest take on a hot hatch." },
      { id: "bullrun", title: "We Are Going On Bullrun", year: 2014, genres: ["Documentary", "Adventure"], duration: "0:47", curated: "Trending", src: B + "WeAreGoingOnBullrun.mp4", blurb: "Gear up for the rally of a lifetime." },
    ];

    const GENRES = Array.from(new Set(MOVIES.flatMap((m) => m.genres))).sort();
    const getMovie = (id) => MOVIES.find((m) => m.id === id) || MOVIES[0];

    function fuzzyScore(query, text) {
      const q = query.toLowerCase().replace(/\s+/g, "");
      const t = text.toLowerCase();
      if (!q) return 0;
      let ti = 0, score = 0, streak = 0;
      for (const ch of q) {
        const idx = t.indexOf(ch, ti);
        if (idx === -1) return -1;
        streak = idx === ti ? streak + 1 : 0;
        score += 1 + streak * 2 + (idx === 0 || t[idx - 1] === " " ? 3 : 0);
        ti = idx + 1;
      }
      return score;
    }

    function searchMovies(query, genre, curated) {
      return MOVIES.map((m) => ({ m, s: fuzzyScore(query, `${m.title} ${m.genres.join(" ")}`) }))
        .filter(({ m, s }) => s >= 0 && (!genre || m.genres.includes(genre)) && (!curated || m.curated === curated))
        .sort((a, b) => b.s - a.s)
        .map(({ m }) => m);
    }

    // --- PROFILE MANAGEMENT (src/lib/profile.ts) ---
    const AVATARS = ["🎬", "🍿", "👾", "🦊", "🤖", "⚡", "🌙", "🔥"];
    const KEY = "cinesync:profile";
    const EVT = "cinesync:profile-change";
    const uid = () => Math.random().toString(36).slice(2, 10);

    function readProfile() {
      try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; }
    }

    function saveProfile(p) {
      const full = { ...p, id: p.id || readProfile()?.id || uid() };
      localStorage.setItem(KEY, JSON.stringify(full));
      window.dispatchEvent(new Event(EVT));
      return full;
    }

    function signOut() {
      localStorage.removeItem(KEY);
      window.dispatchEvent(new Event(EVT));
    }

    function useProfile() {
      const [state, setState] = useState({ ready: false, profile: null });
      useEffect(() => {
        const sync = () => setState({ ready: true, profile: readProfile() });
        sync();
        window.addEventListener(EVT, sync);
        return () => window.removeEventListener(EVT, sync);
      }, []);
      return state;
    }

    function validateName(name) {
      const n = name.trim();
      if (n.length < 2) return "Nickname needs at least 2 characters";
      if (n.length > 16) return "Keep it under 16 characters";
      if (!/^[\w .-]+$/.test(n)) return "Letters, numbers, spaces, . - _ only";
      return null;
    }

    function validateCode(code) {
      return /^[A-Z0-9]{6}$/.test(code.trim().toUpperCase()) ? null : "Room codes are 6 letters/numbers";
    }

    // --- MOCK REAL-TIME ROOM SERVER (src/lib/room.ts) ---
    const DRIFT_THRESHOLD_MS = 500;
    const LATENCY_TARGET_P95_MS = 250;

    function masterTime(p, now = Date.now()) {
      return p.position + (p.playing ? (now - p.updatedAt) / 1000 : 0);
    }

    function percentile(samples, q) {
      if (!samples.length) return 0;
      const s = [...samples].sort((a, b) => a - b);
      return s[Math.min(s.length - 1, Math.ceil(q * s.length) - 1)] ?? 0;
    }

    function needsCorrection(driftMs) {
      return Math.abs(driftMs) > DRIFT_THRESHOLD_MS;
    }

    const BOTS = [
      { name: "Mira", avatar: "🦊" },
      { name: "Theo", avatar: "🤖" },
      { name: "Juno", avatar: "🌙" },
    ];
    const BOT_LINES = [
      "this scene 🔥",
      "lol",
      "wait rewind that",
      "the music here is so good",
      "who picked this? love it",
      "popcorn break soon?",
      "👀",
      "ok I'm hooked"
    ];
    const EMOJIS = ["🔥", "😂", "❤️", "👏", "😮", "🍿"];
    const REACTION_EMOJIS = EMOJIS;

    const lat = () => Math.round(20 + Math.random() * 80 + (Math.random() < 0.06 ? 90 : 0));

    function generateCode() {
      const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      return Array.from({ length: 6 }, () => c[Math.floor(Math.random() * c.length)]).join("");
    }

    class Room {
      constructor(code) {
        this.listeners = new Set();
        this.timer = null;
        this.dropRate = 0.03;
        const saved = typeof localStorage !== "undefined" ? localStorage.getItem(`cinesync:room:${code}`) : null;
        if (saved) {
          this.state = { ...JSON.parse(saved), reactions: [] };
        } else {
          const bots = BOTS.map((b) => ({
            id: "bot-" + b.name.toLowerCase(),
            ...b,
            isBot: true,
            online: true,
            drift: 0,
            latency: lat()
          }));
          this.state = {
            code,
            hostId: "",
            participants: bots,
            playback: { movieId: MOVIES[0].id, playing: false, position: 0, updatedAt: Date.now() },
            queue: ["sintel", "tos", "fun"],
            chat: [],
            poll: null,
            reactions: [],
            telemetry: { samples: [], corrections: 0, errors: 0, retries: 0, localDrift: 0, lastAction: "—" },
          };
        }
      }

      subscribe = (fn) => {
        this.listeners.add(fn);
        if (!this.timer) this.timer = setInterval(() => this.tick(), 1000);
        return () => {
          this.listeners.delete(fn);
          if (!this.listeners.size && this.timer) {
            clearInterval(this.timer);
            this.timer = null;
          }
        };
      };

      getSnapshot = () => this.state;

      commit(patch) {
        this.state = { ...this.state, ...patch };
        const { reactions: _r, ...persist } = this.state;
        try { localStorage.setItem(`cinesync:room:${this.state.code}`, JSON.stringify(persist)); } catch {}
        this.listeners.forEach((l) => l());
      }

      tel(patch) {
        this.commit({ telemetry: { ...this.state.telemetry, ...patch } });
      }

      send(by, label, apply, attempt = 0) {
        const up = lat();
        if (Math.random() < this.dropRate && attempt < 3) {
          this.tel({ errors: this.state.telemetry.errors + 1, retries: this.state.telemetry.retries + 1 });
          setTimeout(() => this.send(by, label, apply, attempt + 1), 150);
          return;
        }
        setTimeout(() => {
          apply();
          const peers = this.state.participants.filter((p) => p.id !== by && p.online);
          const fresh = peers.map(() => up + lat());
          const participants = this.state.participants.map((p) => {
            const i = peers.indexOf(p);
            return i >= 0 ? { ...p, latency: fresh[i] ?? p.latency } : p;
          });
          this.commit({ participants });
          this.tel({
            samples: [...this.state.telemetry.samples, ...fresh].slice(-200),
            lastAction: `${label} · ${Math.max(up, ...fresh)}ms`
          });
        }, up);
      }

      nameOf(id) {
        return this.state.participants.find((p) => p.id === id)?.name ?? "Someone";
      }

      sys(text) {
        return [...this.state.chat, { id: uid(), by: "system", text, ts: Date.now(), system: true }].slice(-150);
      }

      isHost(id) {
        return this.state.hostId === id;
      }

      join(p) {
        const exists = this.state.participants.find((x) => x.id === p.id);
        const participants = exists
          ? this.state.participants.map((x) => (x.id === p.id ? { ...x, name: p.name, avatar: p.avatar, online: true } : x))
          : [...this.state.participants, { id: p.id, name: p.name, avatar: p.avatar, isBot: false, online: true, drift: 0, latency: lat() }];
        this.commit({
          participants,
          hostId: this.state.hostId || p.id,
          chat: exists ? this.state.chat : this.sys(`${p.name} joined the room`)
        });
      }

      setOnline(id, online) {
        this.commit({
          participants: this.state.participants.map((p) => (p.id === id ? { ...p, online } : p)),
          chat: this.sys(`${this.nameOf(id)} ${online ? "reconnected — snapped to master timeline" : "lost connection"}`)
        });
      }

      play(by) {
        this.send(by, "PLAY", () => {
          const pb = this.state.playback;
          if (!pb.playing) this.commit({ playback: { ...pb, position: masterTime(pb), playing: true, updatedAt: Date.now() } });
        });
      }

      pause(by) {
        this.send(by, "PAUSE", () => {
          const pb = this.state.playback;
          if (pb.playing) this.commit({ playback: { ...pb, position: masterTime(pb), playing: false, updatedAt: Date.now() } });
        });
      }

      seek(by, t) {
        this.send(by, `SEEK ${t.toFixed(1)}s`, () => {
          this.commit({ playback: { ...this.state.playback, position: Math.max(0, t), updatedAt: Date.now() } });
        });
      }

      setMovie(by, movieId) {
        this.send(by, "LOAD", () => {
          this.commit({
            playback: { movieId, playing: true, position: 0, updatedAt: Date.now() },
            chat: this.sys(`${this.nameOf(by)} started ${getMovie(movieId).title}`)
          });
        });
      }

      playNext(by) {
        const [next, ...rest] = this.state.queue;
        if (!next) return;
        this.commit({ queue: rest });
        this.setMovie(by, next);
      }

      addToQueue(by, movieId) {
        this.send(by, "QUEUE+", () => {
          this.commit({
            queue: [...this.state.queue, movieId],
            chat: this.sys(`${this.nameOf(by)} queued ${getMovie(movieId).title}`)
          });
        });
      }

      removeFromQueue(by, index) {
        this.send(by, "QUEUE-", () => {
          this.commit({ queue: this.state.queue.filter((_, i) => i !== index) });
        });
      }

      moveInQueue(by, index, dir) {
        this.send(by, "QUEUE↕", () => {
          const q = [...this.state.queue];
          const j = index + dir;
          if (j < 0 || j >= q.length) return;
          [q[index], q[j]] = [q[j], q[index]];
          this.commit({ queue: q });
        });
      }

      chat(by, text) {
        this.send(by, "CHAT", () => {
          this.commit({ chat: [...this.state.chat, { id: uid(), by, text, ts: Date.now() }].slice(-150) });
        });
      }

      react(by, emoji) {
        this.send(by, "REACT", () => {
          const r = { id: uid(), emoji, x: 8 + Math.random() * 84 };
          this.commit({ reactions: [...this.state.reactions, r].slice(-30) });
          setTimeout(() => this.commit({ reactions: this.state.reactions.filter((x) => x.id !== r.id) }), 2700);
        });
      }

      transferHost(by, to) {
        if (!this.isHost(by)) return;
        this.send(by, "HOST→", () => {
          this.commit({ hostId: to, chat: this.sys(`${this.nameOf(to)} is now the host`) });
        });
      }

      startPoll(by, question, options) {
        if (!this.isHost(by)) return;
        this.send(by, "POLL", () => {
          this.commit({
            poll: { id: uid(), question, open: true, options: options.map((label) => ({ label, voters: [] })) },
            chat: this.sys(`Poll: ${question}`)
          });
        });
      }

      vote(by, index) {
        this.send(by, "VOTE", () => {
          const poll = this.state.poll;
          if (!poll?.open) return;
          this.commit({
            poll: {
              ...poll,
              options: poll.options.map((o, i) => ({
                ...o,
                voters: i === index ? [...o.voters.filter((v) => v !== by), by] : o.voters.filter((v) => v !== by)
              }))
            }
          });
        });
      }

      closePoll(by) {
        const poll = this.state.poll;
        if (!poll || !this.isHost(by)) return;
        const winner = [...poll.options].sort((a, b) => b.voters.length - a.voters.length)[0];
        this.send(by, "POLL✓", () => {
          this.commit({ poll: { ...poll, open: false }, chat: this.sys(`Poll closed — "${winner?.label}" wins`) });
        });
      }

      clearPoll(by) {
        if (this.isHost(by)) this.commit({ poll: null });
      }

      reportLocalDrift(ms, corrected) {
        this.tel({ localDrift: ms, corrections: this.state.telemetry.corrections + (corrected ? 1 : 0) });
      }

      tick() {
        let corrections = 0;
        const participants = this.state.participants.map((p) => {
          if (!p.isBot || !p.online) return p;
          let drift = p.drift + (this.state.playback.playing ? Math.round(-70 + Math.random() * 170) : 0);
          if (needsCorrection(drift)) {
            drift = Math.round(-40 + Math.random() * 80);
            corrections++;
          }
          return { ...p, drift };
        });
        this.commit({
          participants,
          telemetry: { ...this.state.telemetry, corrections: this.state.telemetry.corrections + corrections }
        });
        for (const b of participants.filter((p) => p.isBot && p.online)) {
          const r = Math.random();
          if (r < 0.025) this.chat(b.id, BOT_LINES[Math.floor(Math.random() * BOT_LINES.length)]);
          else if (r < 0.06 && this.state.playback.playing) this.react(b.id, EMOJIS[Math.floor(Math.random() * EMOJIS.length)]);
          const poll = this.state.poll;
          if (poll?.open && !poll.options.some((o) => o.voters.includes(b.id)) && Math.random() < 0.25) {
            this.vote(b.id, Math.floor(Math.random() * poll.options.length));
          }
        }
      }
    }

    const rooms = new Map();
    function getRoom(code) {
      const c = code.toUpperCase();
      if (!rooms.has(c)) rooms.set(c, new Room(c));

      return { path: hash.replace(/^#/, "") || "/", navigate };

    function Player({ room, me, offline, showTelemetry }) {
      const s = useRoom(room);
      const v = useRef(null);
      const [now, setNow] = useState(0);
      const [muted, setMuted] = useState(true);
      const [blocked, setBlocked] = useState(false);
      const [duration, setDuration] = useState(0);
      const pb = s.playback;
      const src = getMovie(pb.movieId).src;

      useEffect(() => {
        const el = v.current;
        if (!el || offline) { el?.pause(); return; }
        const target = masterTime(pb);
        if (Math.abs(el.currentTime - target) > DRIFT_THRESHOLD_MS / 1000) el.currentTime = target;
        if (pb.playing && el.paused) el.play().then(() => setBlocked(false)).catch(() => setBlocked(true));
        if (!pb.playing && !el.paused) el.pause();
      }, [pb, offline, src]);

      useEffect(() => {
        const id = setInterval(() => {
          const el = v.current;
          if (!el) return;
          setNow(el.currentTime);
          if (offline || el.readyState < 2) return;
          const p = room.state.playback;
          const drift = Math.round((el.currentTime - masterTime(p)) * 1000);
          const fix = needsCorrection(drift);
          if (fix) el.currentTime = masterTime(p);
          room.reportLocalDrift(fix ? 0 : drift, fix);
        }, 1000);
        return () => clearInterval(id);
      }, [room, offline]);

      const t = offline ? now : Math.min(masterTime(pb), duration || Infinity);
      const tel = s.telemetry;
      const p95 = percentile(tel.samples, 0.95);

      return (
        <div className="relative bg-foreground">
          <video
            ref={v}
            src={src}
            muted={muted}
            playsInline
            className="aspect-video w-full"
            preload="auto"
            onLoadedMetadata={(e) => setDuration(e.currentTarget.duration)}
            onEnded={() => { if (s.hostId === me.id) s.queue.length ? room.playNext(me.id) : room.pause(me.id); }}
          />
          <div className="pointer-events-none absolute inset-0 overflow-hidden">
            {s.reactions.map((r) => (
              <span key={r.id} className="float-up absolute bottom-16 text-4xl" style={{ left: `${r.x}%` }}>{r.emoji}</span>
            ))}
          </div>
          {blocked && !offline && (
            <button
              onClick={() => { setMuted(false); v.current?.play().then(() => setBlocked(false)); }}
              className="absolute inset-0 flex items-center justify-center bg-foreground/80 text-background"
            >
              <span className="cta text-2xl">Tap to join playback <span className="arrow">→</span></span>
            </button>
          )}
          {offline && (
            <div className="absolute inset-0 flex flex-col items-center justify-center bg-foreground/85 text-background">
              <WifiOff size={36} />
              <p className="mt-3 text-2xl font-black uppercase">Connection lost</p>
              <p className="font-mono text-xs">Reconnect to snap back to {fmt(masterTime(pb))}</p>
            </div>
          )}
          {showTelemetry && (
            <div className="absolute right-3 top-3 w-64 border border-foreground bg-background p-3 font-mono text-[11px]">
              <p className="mb-2 font-black uppercase">Developer telemetry</p>
              <Row k="p50 / p95" v={`${percentile(tel.samples, 0.5)} / ${p95}ms`} bad={p95 > LATENCY_TARGET_P95_MS} />
              <Row k="target p95" v={`≤ ${LATENCY_TARGET_P95_MS}ms`} />
              <Row k="your drift" v={`${tel.localDrift > 0 ? "+" : ""}${tel.localDrift}ms`} bad={Math.abs(tel.localDrift) > 250} />
              <Row k="corrections" v={tel.corrections} />
              <Row k="dropped pkts" v={tel.errors} bad={tel.errors > 0} />
              <Row k="retries" v={tel.retries} />
              <Row k="samples" v={tel.samples.length} />
              <Row k="last action" v={tel.lastAction} />
              <div className="mt-2 border-t border-border pt-2">
                {s.participants.filter((p) => p.id !== me.id).map((p) => (
                  <Row key={p.id} k={`${p.avatar} ${p.name}`} v={p.online ? `${p.drift}ms · ${p.latency}ms rtt` : "offline"} bad={!p.online || Math.abs(p.drift) > 350} />
                ))}
              </div>
            </div>
          )}
          <div className="flex items-center gap-3 border-t border-foreground bg-background px-3 py-2">
            <button
              aria-label={pb.playing ? "Pause" : "Play"}
              disabled={offline}
              onClick={() => (pb.playing ? room.pause(me.id) : room.play(me.id))}

              {pb.playing ? <Pause size={16} /> : <Play size={16} />}

            <span className="w-24 font-mono text-xs">{fmt(t)} / {fmt(duration)}</span>
            <input
              type="range"
              min={0}
              max={duration || 1}
              step={0.5}
              value={t}
              disabled={offline}
              onChange={(e) => room.seek(me.id, Number(e.target.value))}

        </div>
      );

    function Chat({ room, me }) {
      const s = useRoom(room);
      const [text, setText] = useState("");
      const end = useRef(null);
      useEffect(() => { end.current?.scrollIntoView({ block: "end" }); }, [s.chat.length]);
      const who = (id) => s.participants.find((p) => p.id === id);
      return (
        <div className="flex h-full max-h-[600px] flex-col lg:max-h-none">
          <div className="flex-1 divide-y divide-border overflow-y-auto">
            {!s.chat.length && <p className="p-4 text-sm text-muted-foreground">Say hi to the room.</p>}
            {s.chat.map((m) =>
              m.system ? (
                <p key={m.id} className="px-4 py-2 font-mono text-[11px] uppercase text-muted-foreground">→ {m.text}</p>
              ) : (
                <div key={m.id} className="px-4 py-2 text-sm">
                  <span className="font-black">{who(m.by)?.avatar} {who(m.by)?.name ?? "?"}{m.by === s.hostId && " ★"}</span>
                  <p className={m.by === me.id ? "font-medium" : ""}>{m.text}</p>
                </div>
              )
            )}
            <div ref={end} />
          </div>
          <form
            className="flex border-t border-foreground"
            onSubmit={(e) => {
              e.preventDefault();
              if (text.trim()) {
                room.chat(me.id, text.trim().slice(0, 300));
                setText("");
              }
            }}
          >
            <input
              className="field border-0"
              value={text}
              onChange={(e) => setText(e.target.value)}
              placeholder="Message the room…"
              maxLength={300}
            />
            <button className="cta border-l border-foreground px-4 text-sm" disabled={!text.trim()}>
              Send <span className="arrow">→</span>
            </button>
          </form>
        </div>
      );
    }

    function Queue({ room, me }) {
      const s = useRoom(room);
      const [pick, setPick] = useState(MOVIES[1].id);
      return (
        <div className="h-full overflow-y-auto">
          <p className="border-b border-border px-4 py-2 font-mono text-[11px] uppercase text-muted-foreground">Up next — anyone can add</p>
          <ol className="divide-y divide-border">
            {s.queue.map((id, i) => (
              <li key={`${id}-${i}`} className="flex items-center gap-3 px-4 py-3">
                <span className="font-mono text-xs text-muted-foreground">{String(i + 1).padStart(2, "0")}</span>
                <span className="flex-1 text-sm font-bold uppercase">{getMovie(id).title}</span>
                <button aria-label="Move up" onClick={() => room.moveInQueue(me.id, i, -1)}><ChevronUp size={15} /></button>
                <button aria-label="Move down" onClick={() => room.moveInQueue(me.id, i, 1)}><ChevronDown size={15} /></button>
                <button aria-label="Remove" onClick={() => room.removeFromQueue(me.id, i)}><XIcon size={15} /></button>
              </li>
            ))}
            {!s.queue.length && <li className="px-4 py-3 text-sm text-muted-foreground">Queue is empty.</li>}
          </ol>
          <div className="flex border-y border-foreground">
            <select className="field border-0" value={pick} onChange={(e) => setPick(e.target.value)}>
              {MOVIES.map((m) => <option key={m.id} value={m.id}>{m.title}</option>)}
            </select>
            <button className="cta border-l border-foreground px-4 text-sm" onClick={() => room.addToQueue(me.id, pick)}>
              Add <span className="arrow">→</span>
            </button>
          </div>
          {s.queue.length > 0 && (
            <button className="cta m-4 text-sm" onClick={() => room.playNext(me.id)}>
              <SkipForward size={14} /> Skip to next <span className="arrow">→</span>
            </button>
          )}
        </div>
      );
    }

    function PollPanel({ room, me, isHost }) {
      const s = useRoom(room);
      const [q, setQ] = useState("What should we watch next?");
      const [opts, setOpts] = useState("");
      const [err, setErr] = useState(null);
      const poll = s.poll;
      const suggest = s.queue.slice(0, 4).map((id) => getMovie(id).title).join(", ");
      const total = poll ? poll.options.reduce((a, o) => a + o.voters.length, 0) : 0;

      return (
        <div className="h-full overflow-y-auto p-4">
          {poll && (
            <div className="border border-foreground p-4">
              <p className="font-mono text-[11px] uppercase text-muted-foreground">{poll.open ? "● Live poll" : "Closed"} · {total} votes</p>
              <h3 className="mt-1 text-xl uppercase">{poll.question}</h3>
              <ul className="mt-3 space-y-2">
                {poll.options.map((o, i) => {
                  const pct = total ? Math.round((o.voters.length / total) * 100) : 0;
                  const mine = o.voters.includes(me.id);
                  return (
                    <li key={i}>
                      <button
                        disabled={!poll.open}
                        onClick={() => room.vote(me.id, i)}
                        className={`relative w-full border p-2 text-left text-sm ${mine ? "border-foreground" : "border-border hover:border-foreground"}`}
                      >
                        <span className="absolute inset-y-0 left-0 bg-muted transition-all duration-500" style={{ width: `${pct}%` }} />
                        <span className="relative flex justify-between font-bold">
                          <span>{mine && "✓ "}{o.label}</span>
                          <span className="font-mono">{pct}%</span>
                        </span>
                      </button>
                    </li>
                  );
                })}
              </ul>
              {isHost && (
                <div className="mt-3 flex gap-4 text-sm">
                  {poll.open ? (
                    <button className="cta" onClick={() => room.closePoll(me.id)}>Close poll <span className="arrow">→</span></button>
                  ) : (
                    <button className="cta" onClick={() => room.clearPoll(me.id)}>New poll <span className="arrow">→</span></button>
                  )}
                </div>
              )}
            </div>
          )}
          {!poll && !isHost && <p className="text-sm text-muted-foreground">Only the host can start a poll. Hang tight.</p>}
          {!poll && isHost && (
            <form
              className="space-y-3"
              onSubmit={(e) => {
                e.preventDefault();
                const list = (opts || suggest).split(",").map((x) => x.trim()).filter(Boolean);
                if (q.trim().length < 3) return setErr("Question is too short");
                if (list.length < 2) return setErr("Add at least 2 comma-separated options");
                setErr(null);
                room.startPoll(me.id, q.trim(), list.slice(0, 6));
              }}
            >
              <h3 className="text-xl uppercase">Start a poll</h3>
              <input className="field" value={q} onChange={(e) => setQ(e.target.value)} />
              <input className="field" value={opts} onChange={(e) => setOpts(e.target.value)} placeholder={suggest || "Option A, Option B"} />
              {err && <p className="text-xs text-destructive">{err}</p>}
              <button className="cta">Launch poll <span className="arrow">→</span></button>
            </form>
          )}
        </div>
      );
    }

    function People({ room, me, isHost }) {
      const s = useRoom(room);
      return (
        <ul className="h-full divide-y divide-border overflow-y-auto">
          {s.participants.map((p) => (
            <li key={p.id} className="flex items-center gap-3 px-4 py-3">
              <span className="text-2xl">{p.avatar}</span>
              <div className="flex-1">
                <p className="flex items-center gap-1 text-sm font-black uppercase">
                  {p.name}{p.id === me.id && " (you)"}{p.id === s.hostId && <Crown size={13} />}
                </p>
                <p className="font-mono text-[11px] text-muted-foreground">
                  <span className={p.online ? "text-success" : "text-destructive"}>●</span> {p.online ? "IN SYNC" : "OFFLINE"} · {p.latency}ms {p.isBot && "· SIM PEER"}
                </p>
              </div>
              {isHost && p.id !== me.id && p.online && (
                <button className="cta text-xs" onClick={() => room.transferHost(me.id, p.id)}>
                  Make host <span className="arrow">→</span>
                </button>
              )}
            </li>
          ))}
          <li className="px-4 py-3">
            <a href="#/" className="cta text-xs">Leave room <span className="arrow">→</span></a>
          </li>
        </ul>
      );
    }

    function App() {
      const { path, navigate } = useHashRoute();
      if (path === "/library") return <LibraryPage />;
      if (path.startsWith("/room/")) {
        const code = path.slice("/room/".length);
        return <RoomPage code={code} />;
      }
      return <HomePage navigate={navigate} />;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
